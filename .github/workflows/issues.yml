name: Issue Automation
on:
  issues:
    types:
      - opened

jobs:
  issue:
    # only run in posit-dev/images.
    if: github.repository == 'posit-dev/images'
    runs-on: ubuntu-latest
    steps:

      - name: GitHub App Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.POSIT_PLATFORM_CLIENT_ID }}
          private-key: ${{ secrets.POSIT_PLATFORM_PEM }}

      - name: Add to Platform Carbon Project
        uses: actions/add-to-project@v2.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          project-url: https://github.com/orgs/posit-dev/projects/17

      - name: Add Default Labels
        uses: actions-ecosystem/action-add-labels@v1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          labels: |
            docker
